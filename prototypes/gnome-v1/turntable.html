<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gnome turntable</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1640; font-family: -apple-system, system-ui, sans-serif; }
  #stage { position: absolute; inset: 0; }
  #ui { position: absolute; left: 0; right: 0; bottom: 16px; z-index: 5; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #ui button { background: rgba(20,16,40,.55); color: #f3e7d2; border: 1px solid rgba(243,231,210,.3);
    border-radius: 999px; padding: 7px 15px; font-size: 13px; cursor: pointer; }
  #ui button.on { background: #f3e7d2; color: #2a2238; border-color: #f3e7d2; }
  #title { position: absolute; left: 16px; top: 14px; z-index: 5; color: #f3e7d2; font-size: 13px; opacity: .85; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="title">Meet the gnome — drag to orbit · pick a pose</div>
<div id="ui"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="materials.js"></script>
<script src="gnome.js"></script>
<script src="pose.js"></script>
<script src="detail.js"></script>
<script>
(function () {
  function ready() { return typeof THREE !== 'undefined' && typeof makeGnome === 'function' && typeof poseGnome === 'function' && typeof texturedMat === 'function' && typeof addGnomeDetail === 'function'; }
  function start() { if (!ready()) return setTimeout(start, 60); run(document.getElementById('stage')); }

  function run(container) {
    const W = () => container.clientWidth || 680, H = () => container.clientHeight || 480;
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(W(), H());
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
    if ('outputEncoding' in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const sky = document.createElement('canvas'); sky.width = 8; sky.height = 256;
    const sg = sky.getContext('2d').createLinearGradient(0, 0, 0, 256);
    sg.addColorStop(0, '#16133c'); sg.addColorStop(0.5, '#3a2a5c'); sg.addColorStop(0.85, '#7e4d68'); sg.addColorStop(1, '#c87f55');
    const sx = sky.getContext('2d'); sx.fillStyle = sg; sx.fillRect(0, 0, 8, 256);
    scene.background = new THREE.CanvasTexture(sky);

    const camera = new THREE.PerspectiveCamera(42, W() / H(), 0.5, 1000);
    camera.position.set(26, 22, 40);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 13, 0); controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.minDistance = 18; controls.maxDistance = 110; controls.maxPolarAngle = Math.PI * 0.52;
    controls.autoRotate = true; controls.autoRotateSpeed = 0.8; controls.update();

    scene.add(new THREE.HemisphereLight(0xffe7c4, 0x2a2238, 0.7));
    const moon = new THREE.DirectionalLight(0xffe1ad, 1.15);
    moon.position.set(-24, 40, 26); moon.castShadow = true;
    moon.shadow.mapSize.set(1024, 1024); moon.shadow.camera.near = 5; moon.shadow.camera.far = 140;
    moon.shadow.camera.left = -30; moon.shadow.camera.right = 30; moon.shadow.camera.top = 40; moon.shadow.camera.bottom = -10;
    moon.shadow.bias = -0.0006; moon.shadow.radius = 4; scene.add(moon);
    const fill = new THREE.DirectionalLight(0x8088ff, 0.35); fill.position.set(28, 16, -24); scene.add(fill);
    const rim = new THREE.PointLight(0xffd27a, 0.5, 120); rim.position.set(0, 26, -22); scene.add(rim);

    const disc = new THREE.Mesh(new THREE.CylinderGeometry(15, 16, 2, 48), new THREE.MeshStandardMaterial({ color: 0x6a6276, roughness: 1 }));
    disc.position.y = -1; disc.receiveShadow = true; scene.add(disc);

    const g = makeGnome({ hatColor: 0x3f6b9c, tunicColor: 0x7a3a8c, shirtColor: 0xe8d9b5, role: 'build' });
    addGnomeDetail(g.parts, { tunicColor: 0x7a3a8c, hatColor: 0x3f6b9c, beardColor: 0xf2f2ee, pouch: true });
    scene.add(g.group);

    let act = 'idle';
    const acts = ['idle', 'walk', 'build', 'carry', 'lift', 'cheer'];
    const ui = document.getElementById('ui');
    acts.forEach(a => {
      const b = document.createElement('button'); b.textContent = a; if (a === act) b.className = 'on';
      b.onclick = () => { act = a; [...ui.children].forEach(c => c.className = (c.textContent === a) ? 'on' : ''); };
      ui.appendChild(b);
    });

    window.__tt = { scene, camera, controls, g, set: (a) => { act = a; [...ui.children].forEach(c => c.className = (c.textContent === a) ? 'on' : ''); }, get: () => act, freezeT: null };
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = window.__tt.freezeT != null ? window.__tt.freezeT : clock.getElapsedTime();
      poseGnome(g.parts, t, act, { speed: 1.0 });
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => { camera.aspect = W() / H(); camera.updateProjectionMatrix(); renderer.setSize(W(), H()); });
  }
  start();
})();
</script>
</body>
</html>
